name: Build RyzerDNS Android APK

on:
  push:
    branches: [ main, master, myket ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: |
          flutter build apk --release
          find build -name "*.apk" -ls

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryzer-dns-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/myket'
        with:
          tag_name: ${{ github.ref == 'refs/heads/myket' && format('v1.1.0-myket-b{0}', github.run_number) || format('v1.0.3-build{0}', github.run_number) }}
          name: ${{ github.ref == 'refs/heads/myket' && format('RyzerDNS Android v1.1.0 (Myket Build {0})', github.run_number) || format('RyzerDNS Android v1.0.3 Build {0}', github.run_number) }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
